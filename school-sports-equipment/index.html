<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>學校運動器材借還管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

    const INITIAL_EQUIPMENT = [
      { id: 'eq-1', name: '標準籃球 (Molten 7號)', category: '球類', total: 30, available: 22, icon: '🏀' },
      { id: 'eq-2', name: '標準排球 (Mikasa)', category: '球類', total: 25, available: 18, icon: '🏐' },
      { id: 'eq-3', name: '五號足球', category: '球類', total: 15, available: 12, icon: '⚽' },
      { id: 'eq-4', name: '羽球拍組 (含2拍1筒球)', category: '拍類', total: 20, available: 14, icon: '🏸' },
      { id: 'eq-5', name: '桌球拍組 (含2拍3球)', category: '拍類', total: 20, available: 16, icon: '🏓' }
    ];

    function App() {
      const [records, setRecords] = useState([]);
      const [equipment, setEquipment] = useState(INITIAL_EQUIPMENT);
      const [studentClass, setStudentClass] = useState('');
      const [studentId, setStudentId] = useState('');
      const [studentName, setStudentName] = useState('');
      const [selectedEq, setSelectedEq] = useState('eq-1');
      const [borrowQty, setBorrowQty] = useState(1);
      const [activeTab, setActiveTab] = useState('borrow');

      const lockedStudentMap = useMemo(() => {
        const map = {};
        records.filter(r => !r.returned).forEach(r => { map[r.studentId] = true; });
        return map;
      }, [records]);

      const isLocked = lockedStudentMap[studentId.trim()];

      const handleBorrow = (e) => {
        e.preventDefault();
        if (isLocked) return alert('該學號有未歸還器材，系統已鎖定！');
        const eq = equipment.find(e => e.id === selectedEq);
        if (borrowQty > eq.available) return alert('庫存不足！');

        setRecords([{
          id: Date.now(),
          studentClass, studentId, studentName,
          itemName: eq.name, eqId: eq.id, qty: parseInt(borrowQty),
          time: new Date().toLocaleString(), returned: false
        }, ...records]);

        setEquipment(equipment.map(e => e.id === selectedEq ? { ...e, available: e.available - borrowQty } : e));
        setStudentId(''); setStudentName(''); alert('借用成功！');
      };

      const handleReturn = (rec) => {
        setRecords(records.map(r => r.id === rec.id ? { ...r, returned: true } : r));
        setEquipment(equipment.map(e => e.id === rec.eqId ? { ...e, available: e.available + rec.qty } : e));
      };

      return (
        <div className="min-h-screen bg-slate-100 p-4 font-sans">
          <header className="bg-blue-700 text-white p-4 rounded-xl shadow-lg mb-6 text-center">
            <h1 className="text-xl font-bold">🏫 學校運動器材借還管理系統</h1>
          </header>
          
          <div className="flex gap-2 mb-4 justify-center">
            <button onClick={() => setActiveTab('borrow')} className={`px-4 py-2 rounded-lg font-bold ${activeTab === 'borrow' ? 'bg-blue-600 text-white' : 'bg-white'}`}>登記借用</button>
            <button onClick={() => setActiveTab('records')} className={`px-4 py-2 rounded-lg font-bold ${activeTab === 'records' ? 'bg-blue-600 text-white' : 'bg-white'}`}>借還管理</button>
          </div>

          {activeTab === 'borrow' && (
            <div className="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
              <form onSubmit={handleBorrow} className="space-y-4">
                <input type="text" placeholder="班級" value={studentClass} onChange={e => setStudentClass(e.target.value)} className="w-full p-2 border rounded" required />
                <input type="text" placeholder="學號" value={studentId} onChange={e => setStudentId(e.target.value)} className="w-full p-2 border rounded" required />
                <input type="text" placeholder="姓名" value={studentName} onChange={e => setStudentName(e.target.value)} className="w-full p-2 border rounded" required />
                {isLocked && <div className="text-red-600 font-bold text-sm">⛔ 該學生有未歸還器材，系統已鎖定！</div>}
                <select value={selectedEq} onChange={e => setSelectedEq(e.target.value)} className="w-full p-2 border rounded">
                  {equipment.map(e => <option key={e.id} value={e.id}>{e.icon} {e.name} (庫存: {e.available})</option>)}
                </select>
                <input type="number" min="1" value={borrowQty} onChange={e => setBorrowQty(e.target.value)} className="w-full p-2 border rounded" required />
                <button type="submit" disabled={isLocked} className="w-full bg-blue-600 text-white py-2 rounded font-bold disabled:bg-gray-400">確認借用</button>
              </form>
            </div>
          )}

          {activeTab === 'records' && (
            <div className="max-w-xl mx-auto bg-white p-4 rounded-xl shadow space-y-2">
              {records.length === 0 ? <p className="text-center text-gray-500">尚無紀錄</p> : records.map(r => (
                <div key={r.id} className="flex justify-between items-center p-3 border-b text-sm">
                  <div>
                    <span className="font-bold">{r.studentName} ({r.studentClass})</span>
                    <p className="text-xs text-gray-500">{r.itemName} × {r.qty} | {r.time}</p>
                  </div>
                  {!r.returned ? (
                    <button onClick={() => handleReturn(r)} className="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-bold">歸還</button>
                  ) : <span className="text-gray-400 text-xs">已歸還</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
